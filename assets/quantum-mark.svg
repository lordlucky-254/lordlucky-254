<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Quantum orbital mark</title>
  <desc id="desc">Three intersecting quantum-inspired orbital paths around a glowing center.</desc>
  <defs><linearGradient id="q" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00E5FF"/><stop offset=".55" stop-color="#176BFF"/><stop offset="1" stop-color="#9747FF"/></linearGradient><radialGradient id="b"><stop stop-color="#14244A"/><stop offset="1" stop-color="#080B18"/></radialGradient></defs>
  <circle cx="60" cy="60" r="56" fill="url(#b)" stroke="#176BFF" stroke-opacity=".45"/>
  <g fill="none" stroke="url(#q)" stroke-width="2.5"><ellipse cx="60" cy="60" rx="39" ry="15" transform="rotate(-35 60 60)"/><ellipse cx="60" cy="60" rx="39" ry="15" transform="rotate(35 60 60)"/><ellipse cx="60" cy="60" rx="39" ry="15" transform="rotate(90 60 60)" opacity=".7"/></g>
  <circle cx="60" cy="60" r="6" fill="#00E5FF"/><circle cx="93" cy="39" r="3" fill="#9747FF"/><circle cx="26" cy="78" r="3" fill="#00E5FF"/>
</svg>
