<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LordLucky — Engineering the Impossible</title>
  <desc id="desc">Minimal obsidian-black portfolio banner with refined champagne-gold geometry and a message about engineering the impossible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.58" stop-color="#10100F"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6A66B" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#E4D0A7"/>
      <stop offset="1" stop-color="#C6A66B" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#C6A66B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#C6A66B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#F5F5F5" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <ellipse cx="935" cy="210" rx="330" ry="260" fill="url(#aura)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M720 88C850 145 1005 145 1135 80" stroke="#C6A66B" stroke-opacity=".55"/>
    <path d="M688 332C820 270 1006 272 1145 340" stroke="#C6A66B" stroke-opacity=".34"/>
    <circle cx="930" cy="210" r="145" stroke="#C6A66B" stroke-opacity=".22"/>
    <circle cx="930" cy="210" r="112" stroke="#C6A66B" stroke-opacity=".35" stroke-dasharray="1 10"/>
    <path d="M64 64h38M64 64v38M1136 64h-38M1136 64v38M64 356h38M64 356v-38M1136 356h-38M1136 356v-38" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <text x="92" y="112" fill="#C6A66B" font-family="monospace" font-size="14" letter-spacing="4">LORDLUCKY  /  INDEPENDENT BUILDER</text>
  <text x="88" y="209" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="600" letter-spacing="-2">ENGINEERING</text>
  <text x="88" y="276" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="600" letter-spacing="-2">THE IMPOSSIBLE<tspan fill="#C6A66B">.</tspan></text>
  <path d="M91 305h390" stroke="url(#gold)" stroke-width="2"/>
  <text x="92" y="341" fill="#A5A29B" font-family="monospace" font-size="15" letter-spacing="1">SOFTWARE  /  RESPONSIBLE SECURITY  /  USEFUL IDEAS</text>
  <text x="1090" y="370" fill="#C6A66B" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="2">BUILD WITH PURPOSE</text>
</svg>
