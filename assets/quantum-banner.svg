<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Developer — LordLucky</title>
  <desc id="desc">A midnight-blue quantum research interface with an orbital mark, neon blue and purple accents, and the message Engineering the future.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B18"/><stop offset="1" stop-color="#10152B"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00E5FF"/><stop offset=".52" stop-color="#176BFF"/><stop offset="1" stop-color="#9747FF"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#176BFF" stop-opacity=".22"/><stop offset="1" stop-color="#080B18" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9AB4FF" stroke-opacity=".07" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="900" cy="170" rx="330" ry="220" fill="url(#halo)"/>
  <path d="M0 300C240 240 350 370 620 280S1000 200 1200 260" fill="none" stroke="url(#glow)" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(925 178)" fill="none" stroke="url(#glow)" stroke-width="2.2">
    <ellipse rx="164" ry="62" transform="rotate(-30)" opacity=".8"/>
    <ellipse rx="164" ry="62" transform="rotate(30)" opacity=".65"/>
    <ellipse rx="164" ry="62" transform="rotate(90)" opacity=".45"/>
    <circle r="15" fill="#080B18" stroke="#00E5FF" stroke-width="3"/>
    <circle cx="140" cy="-48" r="5" fill="#00E5FF" stroke="none"/>
    <circle cx="-140" cy="48" r="5" fill="#9747FF" stroke="none"/>
  </g>
  <circle cx="925" cy="178" r="120" fill="#00E5FF" opacity=".08" filter="url(#soft)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="78" fill="#00E5FF" font-size="13" letter-spacing="3">QUANTUM SYSTEM // ONLINE</text>
    <text x="72" y="158" fill="#F4F7FF" font-size="53" font-weight="700" letter-spacing="-2">LORDLUCKY</text>
    <text x="74" y="204" fill="#AEBBDD" font-size="20" letter-spacing="2">ENGINEERING THE FUTURE.</text>
    <rect x="74" y="239" width="9" height="20" rx="2" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="96" y="254" fill="#8291B6" font-size="13" letter-spacing="2">SOFTWARE · RESPONSIBLE SECURITY · AI/ML LEARNING</text>
    <text x="74" y="320" fill="#68769B" font-size="11" letter-spacing="2">INDEPENDENT BUILDER  /  RESEARCH MODE: CURIOUS</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#glow)" stroke-opacity=".32"/>
</svg>
